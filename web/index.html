<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMind | Premium RAG Experience</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/chat.css">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <i class="fas fa-book-open header-icon"></i>
            <h1>BookMind RAG</h1>
        </div>
        
        <div class="header-badges">
            <div class="model-selector-wrapper">
                <i class="fas fa-robot selector-icon"></i>
                <select id="modelSelector" class="model-selector">
                    <option value="">⏳ กำลังโหลดโมเดล...</option>
                </select>
            </div>
            <a href="/admin" class="badge-db" style="text-decoration: none; padding: 8px 16px; border-radius: 20px;">
                <i class="fas fa-cog"></i> คลังความรู้
            </a>
        </div>
    </header>

    <main class="main-layout">
        <section class="chat-container">
            <div id="chatMessages" class="chat-messages">
                <!-- Welcome Card -->
                <div class="welcome-card" style="margin-top: 10vh; text-align: center;">
                    <div style="font-size: 64px; margin-bottom: 20px;">📘</div>
                    <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 12px;">ยินดีต้อนรับสู่ BookMind</h2>
                    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 32px;">ถามอะไรก็ได้เกี่ยวกับหนังสือในคลัง ระบบจะวิเคราะห์และตอบจากเนื้อหาจริง</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-controls">
                        <label class="hyde-toggle">
                            <input type="checkbox" id="hydeToggle" checked>
                            <div class="toggle-slider"></div>
                            <span class="toggle-label">🪄 HyDE</span>
                        </label>
                        <label class="hyde-toggle">
                            <input type="checkbox" id="agenticToggle">
                            <div class="toggle-slider"></div>
                            <span class="toggle-label">🧠 Agentic</span>
                        </label>
                    </div>
                    <div class="input-row">
                        <textarea id="queryInput" placeholder="ถามเกี่ยวกับหนังสือ..." rows="1"></textarea>
                        <button id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="sources-panel">
            <div class="sources-header">
                <i class="fas fa-quote-left" style="color: var(--accent);"></i>
                <h3>แหล่งอ้างอิง</h3>
            </div>
            <div id="sourcesList" class="sources-list">
                <div style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 13px;">
                    แหล่งอ้างอิงจะแสดงที่นี่เมื่อคุณถาม
                </div>
            </div>
        </aside>
    </main>

    <!-- JS Modules -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
