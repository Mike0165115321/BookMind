<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMind | AI Intelligence</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/base.css?v=2">
    <link rel="stylesheet" href="/static/css/layout.css?v=2">
    <link rel="stylesheet" href="/static/css/chat.css?v=3">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="theme-dark">
    <div class="app-wrapper">
        <!-- ── Sidebar ── -->
        <aside class="sidebar" id="sidebar">
            <!-- Sidebar Rail (Always visible narrow column) -->
            <div class="sidebar-rail">
                <div class="rail-top">
                    <button class="icon-btn" id="sidebarToggle" title="Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="icon-btn rail-new-chat" id="railNewChatBtn" title="แชทใหม่">
                        <i class="far fa-edit"></i>
                    </button>
                </div>
                <div class="rail-bottom">
                    <button class="icon-btn" id="railSettingsBtn" title="ตั้งค่า">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>

            <!-- Sidebar Panel (Expandable content) -->
            <div class="sidebar-panel">
                <div class="sidebar-brand">
                    <div class="brand-info">
                        <span class="brand-name">BookMind</span>
                        <span class="brand-sub">by Aetox.dev</span>
                    </div>
                </div>

                <div class="sidebar-header">
                    <button class="new-chat-btn" id="newChatBtn">
                        <i class="far fa-edit"></i>
                        <span>แชทใหม่</span>
                    </button>
                </div>
                
                <div class="history-section">
                    <div id="historyList" class="history-list">
                        <!-- History items will be loaded from DB -->
                    </div>
                </div>

                <div class="sidebar-footer">
                    <a href="/admin" class="nav-item">
                        <i class="fas fa-rocket"></i>
                        <span>เพิ่มข้อมูล</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- ── Main Content ── -->
        <main class="main-content">
            <button class="icon-btn floating-toggle" id="sidebarToggle" title="Toggle Sidebar">
                <i class="fas fa-columns"></i>
            </button>

            <button class="icon-btn floating-toggle-right" id="sourcesToggle" title="Toggle Sources">
                <i class="fas fa-quote-right"></i>
            </button>

            <!-- Chat Area -->
            <div id="chatMessages" class="chat-viewport">
                <!-- Welcome State (Visible when no messages) -->
                <div class="welcome-hero" id="welcomeHero">
                    <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted);">BookMind</h2>
                    <p style="color: var(--text-muted); opacity: 0.6;">วันนี้มีอะไรให้ช่วยไหมครับ?</p>
                </div>
            </div>

            <!-- Floating Input Area -->
            <div class="input-container">
                <div id="filePreviewContainer" class="file-preview-container" style="display: none;">
                    <span id="fileName"></span>
                    <button id="clearFileBtn">&times;</button>
                </div>
                <div class="floating-input-wrapper">
                    <textarea id="queryInput" placeholder="Send a message" rows="1"></textarea>
                    
                    <div class="input-right-actions">
                        <button class="input-action-btn" id="uploadTempBtn" title="Add files">
                            <i class="fas fa-plus"></i>
                        </button>
                        <input type="file" id="tempFileInput" style="display:none">
                        
                        <button class="input-action-btn" id="webSearchBtn" title="Web Search">
                            <i class="fas fa-globe"></i>
                        </button>

                        <button id="sendBtn" class="send-btn">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
                
                <div class="input-footer" style="display: flex; align-items: center; gap: 16px;">
                    <label class="pill-toggle">
                        <input type="checkbox" id="hydeToggle">
                        <div class="pill-btn">
                            <i class="fas fa-magic"></i>
                            <span>HyDE</span>
                        </div>
                    </label>
                    <label class="pill-toggle">
                        <input type="checkbox" id="agenticToggle">
                        <div class="pill-btn">
                            <i class="fas fa-atom"></i>
                            <span>Agentic</span>
                        </div>
                    </label>
                    
                    <!-- Persona Floating Menu -->
                    <div class="dropdown-control" style="position: relative;">
                        <button id="personaMenuBtn" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; color: var(--text-main); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <i class="fas fa-user-circle"></i>
                            <span id="currentPersonaLabel">บทบาท: ทั่วไป</span>
                            <i class="fas fa-chevron-up" style="font-size: 10px;"></i>
                        </button>
                        <div id="personaFloatingMenu" style="display: none; position: absolute; bottom: 130%; left: 0; background: #1a1d24; border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; min-width: 160px;">
                            <!-- Dynamic items -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ── Right Sidebar (Sources) ── -->
        <aside class="sidebar-right collapsed" id="sourcesPanel">
            <div class="sidebar-header" style="margin-top: 48px;">
                <label style="font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Sources</label>
            </div>
            <div id="sourcesList" class="sources-list">
                <!-- Sources will be rendered here -->
            </div>
        </aside>

    </div>

    <!-- JS Modules -->
    <script type="module" src="/static/js/main.js?v=6"></script>
</body>
</html>
