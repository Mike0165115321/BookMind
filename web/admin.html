<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Admin | BookMind</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/base.css?v=4">
    <link rel="stylesheet" href="/static/css/layout.css?v=4">
    <link rel="stylesheet" href="/static/css/admin.css?v=4">
</head>
<body class="theme-dark">
    <div class="app-wrapper">
        <!-- ── Sidebar ── -->
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-rail">
                <div class="rail-top">
                    <a href="/" class="icon-btn" title="Back to Chat">
                        <i class="fas fa-comment-dots"></i>
                    </a>
                </div>
                <div class="rail-bottom">
                    <a href="/settings" class="icon-btn" title="Settings">
                        <i class="fas fa-cog"></i>
                    </a>
                </div>
            </div>
            <!-- Panel is hidden in collapsed mode by default -->
        </aside>

        <!-- ── Main Content ── -->
        <main class="main-content" style="overflow-y: auto;">
            <div class="admin-container">
                <header class="admin-header">
                    <h1>แผงควบคุมระบบ</h1>
                    <p>จัดการฐานข้อมูลความรู้สำหรับ AI Intelligence</p>
                </header>

                <div class="glass-card">
                    <h2 style="font-size: 18px; margin-bottom: 20px;"><i class="fas fa-cloud-upload-alt" style="color: var(--blue-light); margin-right: 10px;"></i> นำเข้าข้อมูล (Ingestion)</h2>
                    
                    <form id="uploadForm">
                        <div class="form-group">
                            <label>เลือกเอกสาร (PDF, DOCX, JSON, JSONL, MD, CSV, Excel, PPTX)</label>
                            <input type="file" id="fileInput" class="admin-input" 
                                   accept=".pdf,.docx,.doc,.pptx,.xlsx,.xls,.csv,.txt,.jsonl,.json,.md,.markdown,.svg,.html,.htm" 
                                   style="padding: 30px; border: 2px dashed var(--border); background: rgba(255,255,255,0.01);" 
                                   multiple required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>ชื่อเรียกหนังสือ (เว้นว่างเพื่อใช้ชื่อไฟล์)</label>
                                <input type="text" id="bookTitle" class="admin-input" placeholder="เช่น คู่มือพนักงาน 2024">
                            </div>
                            <div class="form-group">
                                <label>หมวดหมู่</label>
                                <input type="text" id="category" class="admin-input" placeholder="เช่น การเงิน, กฎหมาย">
                            </div>
                        </div>

                        <button type="submit" id="uploadBtn" class="btn-submit">
                            <i class="fas fa-plus-circle"></i> เริ่มการสร้างเวกเตอร์ (Index Data)
                        </button>
                    </form>
                </div>

                <div class="glass-card">
                    <h2 style="font-size: 18px; margin-bottom: 20px;"><i class="fas fa-database" style="color: var(--blue-light); margin-right: 10px;"></i> รายการเอกสารในระบบ</h2>
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ชื่อไฟล์</th>
                                    <th>ชื่อหนังสือ</th>
                                    <th>หมวดหมู่</th>
                                    <th>สถานะ</th>
                                    <th>Chunks</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="docTableBody">
                                <!-- Documents will load here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination" class="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allDocuments = [];
        let currentPage = 1;
        const pageSize = 10;

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const data = await response.json();
                allDocuments = (data.documents || []).reverse();
                renderTable();
            } catch (err) {
                console.error('Failed to load documents:', err);
            }
        }

        function renderTable() {
            const docTableBody = document.getElementById('docTableBody');
            docTableBody.innerHTML = '';
            
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageDocs = allDocuments.slice(start, end);
            
            pageDocs.forEach(doc => {
                const row = document.createElement('tr');
                const statusClass = `status-${doc.status.toLowerCase()}`;
                const isError = doc.status === 'ERROR';
                const isProcessing = doc.status === 'PROCESSING';

                row.innerHTML = `
                    <td><i class="far fa-file-alt" style="margin-right:8px; color:#6366f1"></i> ${doc.filename}</td>
                    <td>${doc.book_title || '-'}</td>
                    <td><span class="badge">${doc.category || 'General'}</span></td>
                    <td>
                        <span class="status-pill ${statusClass} ${isProcessing ? 'animate-pulse' : ''}">
                            <i class="fas ${getStatusIcon(doc.status)}"></i> ${doc.status}
                        </span>
                    </td>
                    <td style="font-weight:600; color:#a855f7">${doc.total_chunks || 0}</td>
                    <td class="actions">
                        ${isError ? `
                            <button class="action-btn btn-retry" onclick="retryDoc(${doc.id})" title="ลองใหม่">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        ` : ''}
                        <button class="action-btn btn-delete" onclick="deleteDoc(${doc.id})" title="ลบ">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                docTableBody.appendChild(row);
            });
            
            renderPagination();
        }

        function renderPagination() {
            const paginationEl = document.getElementById('pagination');
            if (!paginationEl) return;
            paginationEl.innerHTML = '';
            
            const totalPages = Math.ceil(allDocuments.length / pageSize);
            if (totalPages <= 1) return;
            
            const info = document.createElement('span');
            info.className = 'pagination-info';
            info.innerHTML = `หน้า ${currentPage} จาก ${totalPages} (ทั้งหมด ${allDocuments.length} รายการ) &nbsp;&nbsp;`;
            paginationEl.appendChild(info);
            
            const prevBtn = document.createElement('button');
            prevBtn.className = 'pagination-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i> ก่อนหน้า';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderTable(); };
            paginationEl.appendChild(prevBtn);
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; renderTable(); };
                paginationEl.appendChild(btn);
            }
            
            const nextBtn = document.createElement('button');
            nextBtn.className = 'pagination-btn';
            nextBtn.innerHTML = 'ถัดไป <i class="fas fa-chevron-right"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderTable(); };
            paginationEl.appendChild(nextBtn);
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'COMPLETED': return 'fa-check-circle';
                case 'ERROR': return 'fa-exclamation-circle';
                case 'PROCESSING': return 'fa-spinner fa-spin';
                default: return 'fa-clock';
            }
        }

        const uploadForm = document.getElementById('uploadForm');
        uploadForm.onsubmit = async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const bookTitle = document.getElementById('bookTitle').value;
            const category = document.getElementById('category').value;
            
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = true;
            
            let successCount = 0;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                uploadBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> (${i+1}/${files.length}) กำลังประมวลผล ${file.name}`;
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('book_title', files.length === 1 && bookTitle ? bookTitle : file.name.split('.')[0]);
                formData.append('category', category || 'General');

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if (result.success) successCount++;
                } catch (err) {
                    console.error('Upload error:', err);
                }
            }

            alert(`อัปโหลดเสร็จสิ้น ${successCount} ไฟล์! AI กำลังเริ่มสร้างเวกเตอร์ในฉากหลัง`);
            uploadForm.reset();
            loadDocuments();
            uploadBtn.disabled = false;
            uploadBtn.innerHTML = '<i class="fas fa-plus-circle"></i> เริ่มการสร้างเวกเตอร์';
        };

        async function retryDoc(id) {
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const response = await fetch(`/api/retry/${id}`, { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    loadDocuments();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        async function deleteDoc(id) {
            if (!confirm('ยืนยันการลบฐานข้อมูลส่วนนี้?')) return;
            try {
                await fetch(`/api/documents/${id}`, { method: 'DELETE' });
                loadDocuments();
            } catch (err) {
                alert('ลบไม่สำเร็จ');
            }
        }

        // Auto refresh table while processing
        setInterval(() => {
            const hasProcessing = document.querySelector('.status-processing');
            if (hasProcessing) loadDocuments();
        }, 3000);

        loadDocuments();
    </script>
</body>
</html>
