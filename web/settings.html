<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบ | BookMind</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <style>
        .settings-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .settings-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .back-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }
        .back-btn:hover {
            background: var(--border);
        }
        .settings-section {
            margin-bottom: 32px;
            padding: 24px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-header h2 {
            font-size: 18px;
            color: var(--accent);
            margin: 0;
        }
        .section-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.3s ease;
        }
        .section-content.hidden {
            display: none;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .form-select:focus {
            border-color: var(--accent);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="theme-dark">
    <div class="settings-container">
        <div class="settings-header">
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
            <h1>ตั้งค่าระบบ</h1>
        </div>

        <!-- ── HyDE Section ── -->
        <div class="settings-section">
            <div class="section-header">
                <h2>🪄 HyDE Settings (Query Expansion)</h2>
            </div>
            <div id="hydeContent" class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label>เลือกค่ายโมเดล</label>
                        <select id="hydeProvider" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>เลือกโมเดล</label>
                        <select id="hydeModel" class="form-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Generation Section ── -->
        <div class="settings-section">
            <div class="section-header">
                <h2>🧠 Generation Settings (คำตอบหลัก)</h2>
            </div>
            <div id="genContent" class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label>เลือกค่ายโมเดล</label>
                        <select id="genProvider" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>เลือกโมเดล</label>
                        <select id="genModel" class="form-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="save-bar" style="display: flex; justify-content: flex-end;">
            <button id="saveBtn" class="primary-btn" style="padding: 12px 40px; font-size: 16px;">
                <i class="fas fa-save" style="margin-right: 10px;"></i> บันทึกการตั้งค่า
            </button>
        </div>
    </div>

    <script type="module">
        import { API } from '/static/js/api.js';

        let allModels = {};

        async function init() {
            try {
                const [models, settings] = await Promise.all([
                    API.fetchModels(),
                    API.fetchSettings()
                ]);
                allModels = models;

                // Setup Sections
                setupSection('hyde', settings.hyde_enable === 'true', settings.hyde_provider, settings.hyde_model);
                setupSection('gen', settings.gen_enable === 'true', settings.gen_provider, settings.gen_model);

            } catch (err) {
                console.error("Init failed:", err);
            }
        }

        function getProviderEmoji(provider) {
            const emojis = {
                'gemini': '🤖',
                'groq': '⚡',
                'ollama': '🏠',
                'openrouter': '🌉'
            };
            return emojis[provider.toLowerCase()] || '🧠';
        }

        function formatName(name) {
            return name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
        }

        function setupSection(prefix, isEnabled, currentProvider, currentModel) {
            const content = document.getElementById(`${prefix}Content`);
            const providerSel = document.getElementById(`${prefix}Provider`);
            const modelSel = document.getElementById(`${prefix}Model`);

            // Populate Providers
            providerSel.innerHTML = '<option value="">เลือกค่ายโมเดล...</option>';
            Object.keys(allModels).sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = `${getProviderEmoji(p)} ${formatName(p)}`;
                if (p === currentProvider) opt.selected = true;
                providerSel.appendChild(opt);
            });

            // Handle Provider Change
            providerSel.addEventListener('change', () => {
                updateModels(prefix, providerSel.value, null);
            });

            // Initial models load
            if (currentProvider) {
                updateModels(prefix, currentProvider, currentModel);
            }
        }

        function updateModels(prefix, provider, selectedModel) {
            const modelSel = document.getElementById(`${prefix}Model`);
            modelSel.innerHTML = '<option value="">เลือกโมเดล...</option>';
            
            if (provider && allModels[provider]) {
                allModels[provider].forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    if (m === selectedModel) opt.selected = true;
                    modelSel.appendChild(opt);
                });
            }
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const settings = {
                hyde_enable: "true",
                hyde_provider: document.getElementById('hydeProvider').value,
                hyde_model: document.getElementById('hydeModel').value,
                gen_enable: "true",
                gen_provider: document.getElementById('genProvider').value,
                gen_model: document.getElementById('genModel').value
            };

            try {
                await API.saveSettings(settings);
                alert("✨ บันทึกการตั้งค่าเรียบร้อยแล้ว!");
            } catch (err) {
                alert("❌ เกิดข้อผิดพลาดในการบันทึก");
            }
        });

        init();
    </script>
</body>
</html>
