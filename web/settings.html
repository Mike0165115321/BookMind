<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบ | BookMind</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <style>
        .settings-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .settings-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .back-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }
        .back-btn:hover {
            background: var(--border);
        }
        .settings-section {
            margin-bottom: 32px;
            padding: 24px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-header h2 {
            font-size: 18px;
            color: var(--accent);
            margin: 0;
        }
        .section-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.3s ease;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .form-select:focus {
            border-color: var(--accent);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="theme-dark">
    <div class="settings-container">
        <div class="settings-header">
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
            <h1>ตั้งค่าระบบ</h1>
        </div>

        <!-- ── HyDE Section ── -->
        <div class="settings-section">
            <div class="section-header">
                <h2>🪄 HyDE Settings (Query Expansion)</h2>
            </div>
            <div id="hydeContent" class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label>เลือกค่ายโมเดล</label>
                        <select id="hydeProvider" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>เลือกโมเดล</label>
                        <select id="hydeModel" class="form-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Agentic Brain Section (New) ── -->
        <div class="settings-section">
            <div class="section-header">
                <h2>🔬 Agentic Brain (Decomposer & Evaluator)</h2>
            </div>
            <div id="agenticContent" class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label>เลือกค่ายโมเดล</label>
                        <select id="agenticProvider" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>เลือกโมเดล</label>
                        <select id="agenticModel" class="form-select"></select>
                    </div>
                </div>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: -10px;">
                    * โมเดลส่วนนี้ใช้สำหรับการวิเคราะห์และประเมินความเพียงพอของข้อมูลในโหมด Agentic
                </p>
            </div>
        </div>

        <!-- ── Generation Section ── -->
        <div class="settings-section">
            <div class="section-header">
                <h2>🧠 Generation Settings (คำตอบหลัก)</h2>
            </div>
            <div id="genContent" class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label>เลือกค่ายโมเดล</label>
                        <select id="genProvider" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>เลือกโมเดล</label>
                        <select id="genModel" class="form-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Persona Section ── -->
        <div class="settings-section">
            <div class="section-header">
                <h2>🎭 Persona Settings (บทบาทของ AI)</h2>
            </div>
            <div class="section-content">
                <div class="form-row">
                    <div class="form-group" style="display: flex; gap: 10px; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label>เลือก Persona</label>
                            <select id="personaId" class="form-select"></select>
                        </div>
                        <button id="showAddPersonaBtn" class="primary-btn" style="padding: 12px; white-space: nowrap; height: 46px; background: rgba(255,255,255,0.1); border: 1px solid var(--border);">
                            <i class="fas fa-plus"></i> เพิ่มบทบาท
                        </button>
                    </div>
                </div>

                <!-- Add Persona Form (Hidden by default) -->
                <div id="addPersonaForm" style="display: none; margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: var(--radius-md); border: 1px solid var(--border);">
                    <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 15px; color: var(--accent-dim);">สร้างบทบาทใหม่</h3>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>ชื่อบทบาท (Label)</label>
                        <input type="text" id="newPersonaLabel" class="form-select" placeholder="เช่น ผู้ช่วยนักการตลาด">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>คำอธิบายสั้นๆ</label>
                        <input type="text" id="newPersonaDesc" class="form-select" placeholder="อธิบายหน้าที่สั้นๆ">
                    </div>
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label>System Prompt (คำสั่งควบคุมบทบาท)</label>
                        <textarea id="newPersonaPrompt" class="form-select" rows="4" placeholder="พิมพ์คำสั่งให้ AI สวมบทบาท..." style="resize: vertical;"></textarea>
                    </div>
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button id="cancelAddPersonaBtn" class="back-btn" style="padding: 8px 16px;">ยกเลิก</button>
                        <button id="saveNewPersonaBtn" class="primary-btn" style="padding: 8px 16px;">บันทึกบทบาท</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="save-bar" style="display: flex; justify-content: flex-end;">
            <button id="saveBtn" class="primary-btn" style="padding: 12px 40px; font-size: 16px;">
                <i class="fas fa-save" style="margin-right: 10px;"></i> บันทึกการตั้งค่า
            </button>
        </div>
    </div>

    <script type="module">
        import { API } from '/static/js/api.js';

        let allModels = {};

        async function loadPersonasUI() {
            const personas = await API.fetchPersonas();
            const pSelect = document.getElementById('personaId');
            pSelect.innerHTML = '';
            const pData = personas.personas || {};
            for (const [id, p] of Object.entries(pData)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = p.meta?.label || id;
                pSelect.appendChild(opt);
            }
            return personas;
        }

        async function init() {
            try {
                const [models, settings] = await Promise.all([
                    API.fetchModels(),
                    API.fetchSettings()
                ]);
                allModels = models;

                // Setup Sections
                setupSection('hyde', settings.hyde_provider, settings.hyde_model);
                setupSection('agentic', settings.agentic_provider || 'groq', settings.agentic_model);
                setupSection('gen', settings.gen_provider, settings.gen_model);

                // Setup Persona Section
                const personasData = await loadPersonasUI();
                const pSelect = document.getElementById('personaId');
                if (settings.persona_id) {
                    pSelect.value = settings.persona_id;
                } else if (personasData.default) {
                    pSelect.value = personasData.default;
                }

            } catch (err) {
                console.error("Init failed:", err);
            }
        }

        function getProviderEmoji(provider) {
            const emojis = {
                'gemini': '🤖',
                'groq': '⚡',
                'ollama': '🏠',
                'openrouter': '🌉'
            };
            return emojis[provider.toLowerCase()] || '🧠';
        }

        function formatName(name) {
            return name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
        }

        function setupSection(prefix, currentProvider, currentModel) {
            const providerSel = document.getElementById(`${prefix}Provider`);
            if (!providerSel) return;

            // Populate Providers
            providerSel.innerHTML = '<option value="">เลือกค่ายโมเดล...</option>';
            Object.keys(allModels).sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = `${getProviderEmoji(p)} ${formatName(p)}`;
                if (p === currentProvider) opt.selected = true;
                providerSel.appendChild(opt);
            });

            // Handle Provider Change
            providerSel.addEventListener('change', () => {
                updateModels(prefix, providerSel.value, null);
            });

            // Initial models load
            if (currentProvider) {
                updateModels(prefix, currentProvider, currentModel);
            }
        }

        function updateModels(prefix, provider, selectedModel) {
            const modelSel = document.getElementById(`${prefix}Model`);
            if (!modelSel) return;
            
            modelSel.innerHTML = '<option value="">เลือกโมเดล...</option>';
            
            if (provider && allModels[provider]) {
                allModels[provider].forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    if (m === selectedModel) opt.selected = true;
                    modelSel.appendChild(opt);
                });
            }
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const settings = {
                hyde_provider: document.getElementById('hydeProvider').value,
                hyde_model: document.getElementById('hydeModel').value,
                agentic_provider: document.getElementById('agenticProvider').value,
                agentic_model: document.getElementById('agenticModel').value,
                gen_provider: document.getElementById('genProvider').value,
                gen_model: document.getElementById('genModel').value,
                persona_id: document.getElementById('personaId').value
            };

            try {
                await API.saveSettings(settings);
                alert("✨ บันทึกการตั้งค่าเรียบร้อยแล้ว!");
            } catch (err) {
                alert("❌ เกิดข้อผิดพลาดในการบันทึก");
            }
        });

        // Add Persona Logic
        const formEl = document.getElementById('addPersonaForm');
        document.getElementById('showAddPersonaBtn').addEventListener('click', () => {
            formEl.style.display = 'block';
        });

        document.getElementById('cancelAddPersonaBtn').addEventListener('click', () => {
            formEl.style.display = 'none';
        });

        document.getElementById('saveNewPersonaBtn').addEventListener('click', async () => {
            const label = document.getElementById('newPersonaLabel').value.trim();
            const desc = document.getElementById('newPersonaDesc').value.trim();
            const prompt = document.getElementById('newPersonaPrompt').value.trim();

            if (!label || !prompt) {
                alert("กรุณากรอกชื่อบทบาทและ System Prompt");
                return;
            }

            try {
                const res = await API.createPersona({
                    label: label,
                    description: desc,
                    system_role: prompt
                });
                
                if (res.status === 'created') {
                    // Reload personas
                    await loadPersonasUI();
                    // Select new
                    document.getElementById('personaId').value = res.id;
                    // Reset and hide form
                    document.getElementById('newPersonaLabel').value = '';
                    document.getElementById('newPersonaDesc').value = '';
                    document.getElementById('newPersonaPrompt').value = '';
                    formEl.style.display = 'none';
                    alert("✅ สร้างบทบาทใหม่เรียบร้อย อย่าลืมกดบันทึกการตั้งค่าด้านล่างด้วยนะครับ");
                }
            } catch (e) {
                alert("❌ เกิดข้อผิดพลาด: " + e.message);
            }
        });

        init();
    </script>
</body>
</html>
