<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบ | BookMind</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <style>
        .settings-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .settings-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .back-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }
        .back-btn:hover {
            background: var(--border);
        }
        .settings-section {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .settings-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }
        .save-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 40px;
        }
    </style>
</head>
<body class="theme-dark">
    <div class="settings-container">
        <div class="settings-header">
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
            <h1>ตั้งค่าระบบ</h1>
        </div>

        <div class="settings-section">
            <h2>🧠 การตั้งค่าโมเดล</h2>
            <div class="form-group">
                <label>ค่ายโมเดลสำหรับ HyDE (Query Expansion)</label>
                <select id="hydeModelSelect" class="form-select">
                    <!-- Loaded dynamically -->
                </select>
            </div>
            <div class="form-group">
                <label>ค่ายโมเดลสำหรับ Generation (คำตอบหลัก)</label>
                <select id="genModelSelect" class="form-select">
                    <!-- Loaded dynamically -->
                </select>
            </div>
        </div>

        <div class="settings-section">
            <h2>⚙️ ค่าพื้นฐาน</h2>
            <div class="form-group">
                <label>อุณหภูมิโมเดล (Temperature)</label>
                <input type="range" min="0" max="1" step="0.1" value="0.7" id="tempRange" style="width: 100%;">
            </div>
        </div>

        <div class="save-bar">
            <button id="saveSettingsBtn" class="primary-btn" style="padding: 12px 32px;">บันทึกข้อมูล</button>
        </div>
    </div>

    <script type="module">
        import { API } from '/static/js/api.js';

        async function loadSettings() {
            const [models, current] = await Promise.all([
                API.fetchModels(),
                API.fetchSettings()
            ]);

            renderOptions('hydeModelSelect', models, current.hyde_model);
            renderOptions('genModelSelect', models, current.gen_model);
        }

        function renderOptions(id, data, currentVal) {
            const sel = document.getElementById(id);
            sel.innerHTML = '';
            for (const [provider, models] of Object.entries(data)) {
                const group = document.createElement('optgroup');
                group.label = provider.toUpperCase();
                models.forEach(model => {
                    const opt = document.createElement('option');
                    const val = `${provider}:${model}`;
                    opt.value = val;
                    opt.textContent = `${provider.toUpperCase()}: ${model}`;
                    if (val === currentVal) opt.selected = true;
                    group.appendChild(opt);
                });
                sel.appendChild(group);
            }
        }

        document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
            const settings = {
                hyde_model: document.getElementById('hydeModelSelect').value,
                gen_model: document.getElementById('genModelSelect').value
            };
            await API.saveSettings(settings);
            alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
        });

        loadSettings();
    </script>
</body>
</html>
